# --- Server Configuration ---
server.port=8443
server.ssl.enabled=true
server.ssl.key-store-type=PKCS12
server.ssl.key-store=classpath:keystore.p12
server.ssl.key-store-password=${SSL_KEY_PASSWORD}
server.ssl.key-alias=hr-assistant

spring.application.name=hr-assistant

# --- Database Configuration ---
# Usa hr_postgres come default se DB_HOST non è settato nel .env
spring.datasource.url=jdbc:postgresql://${DB_HOST:hr_postgres}:5432/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# --- Redis Configuration ---
# Dentro Docker deve puntare al nome del servizio (hr_redis), non localhost
spring.data.redis.host=${REDIS_HOST:hr_redis}
spring.data.redis.port=${REDIS_PORT}

# --- Spring AI (Ollama) Configuration ---
# Dentro Docker deve puntare al nome del servizio (hr_ollama), non localhost
spring.ai.ollama.base-url=${OLLAMA_HOST:http://hr_ollama:11434}
spring.ai.ollama.chat.model=llama3
spring.ai.ollama.chat.options.temperature=0.7

# --- JWT Configuration (MANCAVA QUESTA PARTE!) ---
application.security.jwt.secret-key=${JWT_SECRET_KEY}
application.security.jwt.expiration=${JWT_EXPIRATION}

# --- Tuning Performance ---
spring.jpa.open-in-view=false
spring.datasource.hikari.maximum-pool-size=40
spring.datasource.hikari.connection-timeout=60000