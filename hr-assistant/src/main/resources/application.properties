# --- Server Configuration ---
server.port=8443
server.ssl.enabled=true
server.ssl.key-store-type=PKCS12
server.ssl.key-store=classpath:keystore.p12
server.ssl.key-store-password=${SSL_KEY_PASSWORD}
server.ssl.key-alias=hr-assistant

spring.application.name=hr-assistant

# --- Database Configuration ---
spring.datasource.url=jdbc:postgresql://postgres_db:5432/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# --- Redis Configuration ---
spring.data.redis.host=redis_cache
spring.data.redis.port=6379

# --- Spring AI (Ollama) Configuration ---
spring.ai.ollama.base-url=http://ollama_ai:11434
spring.ai.ollama.model=llama3
spring.ai.ollama.chat.options.temperature=0.7