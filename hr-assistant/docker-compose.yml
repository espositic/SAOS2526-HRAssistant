version: '3.8'

services:
  # --- Database PostgreSQL ---
  postgres_db:
    image: postgres:16
    container_name: hr_postgres
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - hr-network

  # --- Cache Redis ---
  redis_cache:
    image: redis:7.2
    container_name: hr_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - hr-network

  # --- AI Engine Ollama ---
  ollama_ai:
    image: ollama/ollama:latest
    container_name: hr_ollama
    restart: always
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    networks:
      - hr-network
    tty: true

volumes:
  postgres_data:
  redis_data:
  ollama_data:

networks:
  hr-network:
    driver: bridge